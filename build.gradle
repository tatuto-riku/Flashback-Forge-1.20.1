buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

apply plugin: 'org.spongepowered.mixin'

// MixinExtras must be a negotiated Forge Jar-in-Jar dependency. Shading its
// classes directly into Flashback creates a split Java module package when
// another mod also provides MixinExtras (a common occurrence in modpacks).
jarJar.enable()
jarJar.disableDefaultSources()

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createMcpToSrg/output.tsrg"
            mods {
                flashback {
                    source sourceSets.main
                }
            }
        }
        client {}
    }
}

mixin {
    add sourceSets.main, 'flashback.refmap.json'
    config 'flashback.mixins.json'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://jitpack.io/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

configurations {
    shade
    implementation.extendsFrom shade
}

sourceSets.main.java {
    // Loader-specific integrations are intentionally kept out of the native Forge build.
    // Core recording, replay playback and exporting do not require these integrations.
    exclude 'com/moulberry/flashback/FlashbackModMenuApiImpl.java'
    exclude 'com/moulberry/flashback/exporting/FrexFlawlessFramesIntegration.java'
    exclude 'com/moulberry/flashback/compat/valkyrienskies/**'
    // Keep the Forge-native optional compat mixins in this package, while excluding
    // the loader-specific integrations inherited from the Fabric source tree.
    exclude 'com/moulberry/flashback/mixin/compat/axiom/**'
    exclude 'com/moulberry/flashback/mixin/compat/bobby/**'
    exclude 'com/moulberry/flashback/mixin/compat/fabric/**'
    exclude 'com/moulberry/flashback/mixin/compat/iris/**'
    exclude 'com/moulberry/flashback/mixin/compat/replaymod/**'
    exclude 'com/moulberry/flashback/mixin/compat/valkyrienskies/**'
    exclude 'com/moulberry/flashback/mixin/compat/MixinSodiumWorldRenderer.java'
    exclude 'com/moulberry/flashback/mixin/playback/MixinServerTickEvents.java'
}

def devRuntimeJar = tasks.register('devRuntimeJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveBaseName = 'flashback-dev-libraries'
    archiveClassifier = ''
    archiveVersion = ''
    destinationDirectory = layout.buildDirectory.dir('dev-libraries')
    configurations = [project.configurations.shade]
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/versions/**/module-info.class'
    exclude 'module-info.class'
    exclude 'com/llamalad7/mixinextras/**'
    exclude 'META-INF/services/javax.annotation.processing.Processor'
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.3.6'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.3.6'
    runtimeOnly fg.deobf('io.github.llamalad7:mixinextras-forge:0.3.6')
    jarJar('io.github.llamalad7:mixinextras-forge:0.3.6') {
        jarJar.ranged(it, '[0.3.6,0.6)')
    }
    minecraftLibrary files(devRuntimeJar.map { it.archiveFile })
    compileOnly 'maven.modrinth:distanthorizons:3.2.0-b-1.20.1'
    // Compile against the complete mod because the upstream compatibility layer also
    // hooks a few client implementation classes. The dependency remains optional at runtime.
    compileOnly fg.deobf('maven.modrinth:simple-voice-chat:forge-1.20.1-2.6.22')

    shade(implementation('org.bytedeco:javacv-platform:1.5.10') {
        exclude group: 'org.bytedeco', module: 'artoolkitplus'
        exclude group: 'org.bytedeco', module: 'artoolkitplus-platform'
        exclude group: 'org.bytedeco', module: 'flycapture'
        exclude group: 'org.bytedeco', module: 'flycapture-platform'
        exclude group: 'org.bytedeco', module: 'leptonica'
        exclude group: 'org.bytedeco', module: 'leptonica-platform'
        exclude group: 'org.bytedeco', module: 'libdc1394'
        exclude group: 'org.bytedeco', module: 'libdc1394-platform'
        exclude group: 'org.bytedeco', module: 'libfreenect'
        exclude group: 'org.bytedeco', module: 'libfreenect-platform'
        exclude group: 'org.bytedeco', module: 'libfreenect2'
        exclude group: 'org.bytedeco', module: 'libfreenect2-platform'
        exclude group: 'org.bytedeco', module: 'librealsense2'
        exclude group: 'org.bytedeco', module: 'librealsense2-platform'
        exclude group: 'org.bytedeco', module: 'librealsense'
        exclude group: 'org.bytedeco', module: 'librealsense-platform'
        exclude group: 'org.bytedeco', module: 'openblas'
        exclude group: 'org.bytedeco', module: 'openblas-platform'
        exclude group: 'org.bytedeco', module: 'opencv'
        exclude group: 'org.bytedeco', module: 'opencv-platform'
        exclude group: 'org.bytedeco', module: 'tesseract'
        exclude group: 'org.bytedeco', module: 'tesseract-platform'
        exclude group: 'org.bytedeco', module: 'videoinput'
        exclude group: 'org.bytedeco', module: 'videoinput-platform'
    })

    shade(implementation('io.github.spair:imgui-java-binding:1.86.10'))
    shade(implementation('io.github.spair:imgui-java-lwjgl3:1.86.10') {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    })
    shade(implementation('io.github.spair:imgui-java-natives-linux:1.86.10'))
    shade(implementation('io.github.spair:imgui-java-natives-macos:1.86.10'))
    shade(implementation('io.github.spair:imgui-java-natives-windows:1.86.10'))

    shade(implementation('org.lwjgl:lwjgl-nfd:3.3.2') {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    })
    ['macos', 'linux', 'windows', 'macos-arm64', 'linux-arm64', 'windows-arm64'].each { platform ->
        shade(implementation("org.lwjgl:lwjgl-nfd:3.3.2:natives-${platform}") {
            exclude group: 'org.lwjgl'
            exclude group: 'org.lwjgl.lwjgl'
        })
    }
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
    exclude 'fabric.mod.json'
    exclude 'flashback.accesswidener'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest {
        attributes([
            'Specification-Title': 'flashback',
            'Specification-Vendor': 'Moulberry',
            'Specification-Version': '1',
            'Implementation-Title': 'Flashback Forge',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Moulberry / Forge port',
            'MixinConfigs': 'flashback.mixins.json'
        ])
    }
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configure {
    archiveClassifier = 'shaded'
    configurations = [project.configurations.shade]
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'fabric.mod.json'
    exclude 'flashback.accesswidener'
    exclude 'META-INF/versions/**/module-info.class'
    exclude 'module-info.class'
    exclude 'com/llamalad7/mixinextras/**'
    exclude 'META-INF/services/javax.annotation.processing.Processor'
    manifest.inheritFrom(tasks.jar.manifest)
    from(sourceSets.main.output)
}

// Use the already reobfuscated, dependency-shaded Flashback jar as the base,
// then let Forge add MixinExtras under META-INF/jarjar with version metadata.
tasks.named('jarJar', net.minecraftforge.gradle.userdev.tasks.JarJar).configure {
    dependsOn 'reobfShadowJar'
    archiveClassifier = ''
    from({ zipTree(tasks.named('shadowJar').get().archiveFile.get().asFile) })
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest.inheritFrom(tasks.named('shadowJar').get().manifest)
}

reobf {
    shadowJar {}
}

tasks.named('build').configure {
    dependsOn tasks.named('jarJar')
}

tasks.matching { it.name == 'prepareRunClient' }.configureEach {
    dependsOn devRuntimeJar
}

afterEvaluate {
    // MixinGradle attaches source/refmap work to every archive task. This archive
    // contains dependencies only, so retaining that dependency creates a cycle.
    devRuntimeJar.configure {
        setDependsOn([])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact tasks.jarJar
        }
    }
}
