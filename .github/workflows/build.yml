name: Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Forge mod
        run: ./gradlew clean build --no-daemon

      - name: Upload distributable JAR
        uses: actions/upload-artifact@v7
        with:
          name: flashback-forge-1.20.1
          path: |
            build/libs/flashback-*.jar
            !build/libs/*-slim.jar
          if-no-files-found: error
          retention-days: 14
